    title: Williams_Keltner_PSAR
    preregister: configs/preregister/autonomy_gen_004_public_indicators.yaml
    script: scripts/run_autonomy_public_indicator_hunt.py
    args: ["--gen", "004"]
    report_json: artifacts/reports/autonomy/gen_004_latest.json
