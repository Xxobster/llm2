# Autonomous research loop v1 — pre-frozen generation queue.
# RESEARCH_ONLY. Create artifacts/autonomy/STOP to halt.
# Does not authorize VPS deploy. Hard gates in llm2/autonomy/policy.py.

loop_id: autonomy_research_loop_v1
readiness_max: RESEARCH_ONLY
failure_is_success: true
idle_poll_sec: 15
pause_between_gen_sec: 15

# Freeze the next unused public windows before the queue can go idle.
# The nurse also calls scripts/freeze_next_autonomy_public_windows.py.
auto_extend:
  enabled: true
  min_remaining: 12
  batch: 8

policy:
  entry_bar_exit_rate_cap: 0.35
  trades_per_month_min: 4
  trades_per_month_max: 40
  min_trades_flag: 50
  pf_floor: 1.20
  must_beat_control_pf: true
  no_tradingview_scrape: true
  no_live_deploy: true
  lockbox: do_not_rank_on_or_after_2026-05-01

