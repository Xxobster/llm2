  On ETHUSDT 1h direction with the frozen mean_strength|hold12|tp1% signal filter,
  allowing up to 2 or 3 concurrent same-side min-size books when signals cluster
  raises stitched outer-OOS Profit Factor and/or net PnL versus K=1, without
