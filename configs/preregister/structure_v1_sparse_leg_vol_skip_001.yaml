decision_gate: D-060
fold_geometry: v2
related:
  - structure_v1_forecast_filter_on_direction_001  # CLOSED_TRADING_FAIL; do not retune
  - structure_v1_next_retrace_forecast_001  # Stage-1 skill PASS; Stage-2 trade FAIL
  - post_caus_parent_pf_inventory_001
