hypothesis: >
  At leg confirmation only (sparse), trade continuation of the just-confirmed impulse
  with frozen tp1/sl2/hold6. Use causal next_vol as a skip-only filter (train-fold
  75th percentile of predicted vol) — never as a side. Forecast skill and trading
  Profit Factor remain separate gates. next_retrace is NOT used for side or for
  multi-arm selection in this generation (state variable only if logged).

economic_rationale: >
  Dense direction@1h + nest filters failed with PF < 1 even when next_retrace IC
  was high. Sparse decisions match when the structure forecast is knowable and
  cut noise from every-bar entries. next_vol IC ~0.30 is the only residual filter
  claim worth ONE frozen test. If this fails, abandon structure_v1 1h trading
  applications tied to these forecasts without further threshold hunts.

single_arm:
  name: impulse_continuation_plus_next_vol_skip_p75
  decisions: sparse_at_leg_confirm_only
  side_rule: frozen_impulse_continuation  # +1 after up-leg confirm, -1 after down-leg; never from vol or retrace model
  tp_pct: 0.01
  sl_pct: 0.02
  max_hold_bars: 6
  sizing: MIN_EXCHANGE
  forecast_filter:
    target: next_vol
    horizon_bars: 24
    feature_space: structure_v1
    model_selection: ridge_only  # no inner multi-model hunt
    filter_rule:
      name: skip_top_quartile_predicted_vol
      percentile: 75
      fit_scope: train_fold_only
      action_on_trigger: skip_entry
    action_forbidden:
      - increase_leverage
      - widen_size
      - emit_long_or_short_from_vol_forecast
      - change_percentile_from_75
      - multi_arm_search
      - use_next_retrace_to_set_side

control:
  name: sparse_impulse_always_on
  description: same sparse continuation side rule, no volatility skip

universe:
  symbols: [ETHUSDT, BTCUSDT, SOLUSDT]
  timeframe: 1h

selection:
