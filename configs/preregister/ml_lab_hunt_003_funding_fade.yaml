hypothesis: >
  When Binance USDT-perpetual funding is stretched, positioning is crowded.
  Fading the sign of the last completed settlement (short after positive
  funding, long after negative) on the next 1-hour bar, holding up to eight
  1-hour bars (one funding interval), has post-cost profit factor above 1.20
  on pre-2022 Bitcoin / Ether / Solana. The matched control is the opposite
  book (ride the funding sign) at the same frozen absolute thresholds.
  Thresholds are 3 / 5 / 10 basis points per eight-hour print, chosen as
  multiples of the well-known ~1 basis-point typical rate, not from a
  profit-factor search. This is not the already-failed funding-hour
  seasonality test (clock time of settlement); it is the magnitude/sign of
  the realised rate. Hunt 002 showed a 15-minute one-bar reversal is too
  small to pay two fills; this family trades sparsely with an eight-bar hold.

