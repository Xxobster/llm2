# Confluence autonomous hunt 002
# RESEARCH_ONLY. Not live. Frozen before any profit-factor ranking.
#
# New generation (not an add-on to confluence_event_pack_001).
# 001 AND-pack of predicted heads was too sparse. This hunt tests
# ONE predicted head at a time, plus a 3-way regime (reverse /
# continue / range), across a closed Take-Profit / Stop-Loss grid.
generation_id: confluence_autonomous_hunt_002
status: OPEN
readiness_max: RESEARCH_ONLY
frozen_at_utc: "2026-08-19T05:00:00Z"
rank_by: expectancy_intent_all
rank_window: chronological_test_30pct_pre_lockbox
entry_bar_exit_rate_cap: 0.35
oracle_arms: never_promote
lockbox: do_not_rank_on_or_after_2026-05-01
failure_is_success: true
min_test_trades_to_quote: 12
min_test_trades_to_flag: 50

hypothesis: >
  A single calibrated P(future_event) head, used either as a filter on the
  current pivot control or as a standalone entry, can beat that control on
  inner test intent expectancy without collapsing profit factor. A 3-way
  regime head (reverse / continue / range-hold) is allowed to beat
  single-event heads. Predicting raw indicator levels is still rejected.

economic_rationale: >
  Strict AND of several predicted heads almost never fires. One event at a
  time keeps trade count. Consolidation (range-hold) is a distinct claim
  from reversal or continuation and must earn its own seat. Changing the
  Take-Profit / Stop-Loss geometry changes pi-star and trade count; the
  grid is frozen here, not searched after seeing test profit factor.

