selection_rule: >
  Mechanical, applied once, no judgement. (1) Group the 154 screen passes by
  mechanism = (symbol, timeframe, event). (2) Within a group keep the single arm
  with the highest inner profit factor, tie-break higher HAC-adjusted Sharpe then
  more trades. (3) Rank groups by that arm's inner profit factor and keep the top
  12. Session filter and bracket are inherited from the kept arm and are frozen;
  they are NOT re-searched in the outer folds.

multiplicity_note: >
  12 arms are evaluated once each in each outer fold. No arm is ranked, reordered
  or dropped using outer results. Deflated Sharpe uses the full hunt 001 trial
  record (5724 scored arms), not 12.

quotable_metrics: >
  Profit factor, win rate, payoff ratio, annualised and HAC-adjusted Sharpe,
  Sortino, entry-bar exit rate, trades per month, fill percentage and
  touch-resolved rate are scale-free and quotable.
  **Total return, max drawdown percent and recovery factor are NOT quotable** at
  research sizing: positions are minimum-exchange size against the research
  wallet, so exposure runs ~3-5% and drawdown lands near 0.02%. The frozen
  drawdown gates (<=20% baseline, <=25% stress) are therefore passed for a
  sizing reason, not a skill reason, and are reported as NOT_APPLICABLE until a
  capital-realistic sizing study is run.

fill_caveat: >
  Working-limit arms filled only 29-42% of intents inside the work window. The
  per-intent expectancy (expectancy_intent_all) is the honest planning number and
  is roughly 5x lower than per-trade expectancy. Any live pack must reproduce the
  same work-bar cancel horizon or the trade count will not match.

