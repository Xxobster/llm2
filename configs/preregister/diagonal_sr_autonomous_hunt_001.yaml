hypothesis: >
  Causal diagonal support and resistance drawn through confirmed swings,
  alone and in confluence with confirmed horizontal levels, can produce a
  calibrated P(event) head that beats a same-bracket no-edge baseline on
  inner chronological test intent expectancy without collapsing profit
  factor or violating the entry-bar exit rate cap.

economic_rationale: >
  Traders treat multi-touch descending/ascending lines and parallel channels
  as psychological barriers. A close-through plus retest (polarity flip) is
  the classic confirmation. Higher-timeframe lines must only become visible
  after that higher-timeframe candle closes. Tight 0.5 percent / 0.5 percent
  15-minute brackets remain a labeled never-promote negative control because
  the stop sits inside single-bar noise.

