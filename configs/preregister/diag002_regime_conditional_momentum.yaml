hypothesis: >
  The relationship between a 24-bar trailing return and the following 6-bar return on
  BTCUSDT 1h changes sign with regime: positive in the lowest volatility tercile,
  negative while the fast exponential moving average is below the slow one. Neither is
  visible unconditionally.

economic_rationale: >
  In quiet conditions order flow is thinner and a move meets less resistance, so short
  horizon continuation is plausible. In a downtrend, rallies are supply being met, so the
  same trailing move mean-reverts. A single unconditional coefficient averages these two
  opposite regimes toward zero, which is consistent with the unconditional momentum scan
  finding nothing (0 of 33 effects survived).

