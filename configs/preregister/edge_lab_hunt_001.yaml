hypothesis: >
  Three published discretionary frameworks contain a causal, mechanically
  testable core. (1) Inner Circle Trader / Smart Money Concepts: price returns to
  three-bar fair value gaps, order blocks and inverted gaps, and reverses after
  sweeping the liquidity resting beyond a completed session or previous-day
  extreme. (2) Session structure: the New York window carries the scheduled
  United States macro releases and the cash open, so sweep-and-reverse should be
  concentrated there, and weekend bars should be worse than weekday bars.
  (3) Kristjan Kullamagi momentum: a large prior move plus a contracting range
  plus a volume-expansion breakout continues.
  Each is scored as a standalone rule event with a fixed bracket, so a negative
  result is a clean refutation rather than a tuning failure.

selection_window: "strictly before 2022-01-01 (first outer out-of-sample start)"
selection_window_reason: >
  Outer folds begin 2022-01-01. Scoring the screen only on earlier bars keeps
  every outer fold genuinely unseen during selection, which diagonal S/R hunt
  001 did not achieve.
