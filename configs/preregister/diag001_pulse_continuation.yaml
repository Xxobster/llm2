exit_design:
  frozen_utc: "2026-08-03T09:40:00Z"
  frozen_before: "any out-of-sample or tradesim result for this hypothesis"
  no_take_profit_because: >
    The hypothesis is a statement about the 96-bar forward return. A take-profit truncates
    exactly the quantity under test, so adding one would answer a different question and
    would also be the first knob anyone would be tempted to tune. The position exits on the
    96-bar hold or on the protective stop, and on nothing else.
  stop_rationale: >
    0.10 is a protective bound, not a tuned parameter. BTCUSDT 1h realised volatility over a
    96-bar (four day) window sits near 4-6 percent, so a 10 percent stop is roughly twice
    the typical excursion and should bind rarely. It exists to cap the tail and to make the
    liquidation calculation well defined. It was chosen from volatility alone and must not
    be adjusted after seeing any result.
  leverage: 9
  leverage_derivation: >
    floor(1 / (sl_pct + maintenance_buffer + mark_buffer)) = floor(1 / (0.10 + 0.005 + 0.002))
    = floor(9.35) = 9. This is the lowest operational value consistent with the frozen stop,
    per the standing rule that leverage is not alpha. Fixed-quantity PnL is unchanged by it;
    it sets liquidation distance and margin utilisation only.
  costs: >
    tradesim research_costs(): all-taker, Bybit non-VIP 0.055 percent taker and 0.02 percent
    maker, 5 bps entry slippage. Entry is a market order after a three-sigma move, so taker
    plus slippage is the honest assumption. Funding is charged at actual historical
    settlements; a 96-bar hold spans up to twelve of them.
  sizing: >
    tradesim research_sizing(): smallest venue-legal quantity, with the Bybit instrument
    spec supplying quantity step and minimum notional. Any pulse whose minimum executable
    order breaches the risk cap is skipped and counted, not silently resized.

