hypothesis: >
  After an upward volatility-normalised price pulse on BTCUSDT 1h, the subsequent
  96-bar return is positive and larger than the unconditional mean. Downward pulses
  show no comparable effect.

economic_rationale: >
  An upward pulse that clears three trailing standard deviations is more likely to
  reflect forced short covering and a genuine repricing than noise. Liquidation
  cascades unwind over hours, not minutes, so displacement can persist past the bar
  that caused it. The asymmetry is expected: leveraged crypto positioning is
  structurally long, so upward and downward shocks are not mirror images.

